name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Prepare google-services.json
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "Decoding google-services.json from secrets.GOOGLE_SERVICES_JSON_BASE64..."
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | tr -d '\r\n ' | base64 -di > android/app/google-services.json
          elif [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "Writing google-services.json from secrets.GOOGLE_SERVICES_JSON..."
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          elif [ -f "google-services.json" ]; then
            echo "Copying google-services.json from repository root..."
            cp google-services.json android/app/google-services.json
          else
            echo "Warning: No google-services.json found in root or secrets."
          fi

      - name: Prepare debug.keystore (Decode from Secret or Generate)
        run: |
          mkdir -p ~/.android
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding debug.keystore from secrets.DEBUG_KEYSTORE_BASE64..."
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -di > debug.keystore
          elif [ -n "${{ secrets.DEBUG_KEYSTORE }}" ]; then
            echo "Decoding debug.keystore from secrets.DEBUG_KEYSTORE..."
            echo "${{ secrets.DEBUG_KEYSTORE }}" | tr -d '\r\n ' | base64 -di > debug.keystore
          else
            echo "Warning: No debug.keystore secret found. Generating a temporary debug.keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          cp debug.keystore ~/.android/debug.keystore
          cp debug.keystore android/app/debug.keystore

      - name: Register GoogleAuth plugin in MainActivity
        run: |
          cat > android/app/src/main/java/com/idxgaza/traneem/MainActivity.kt << 'EOF'
          package com.idxgaza.traneem

          import android.os.Bundle
          import com.codetrixstudio.capacitor.GoogleAuth.GoogleAuth
          import com.getcapacitor.BridgeActivity

          class MainActivity : BridgeActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  registerPlugin(GoogleAuth::class.java)
                  super.onCreate(savedInstanceState)
              }
          }
          EOF


      - name: Add permissions to AndroidManifest
        run: |
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />|' android/app/src/main/AndroidManifest.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify GoogleAuth plugin
        run: |
          cat android/app/src/main/java/com/idxgaza/traneem/MainActivity.kt

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
