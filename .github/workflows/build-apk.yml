name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Add Android platform
        run: npx cap add android

      - name: Add storage permission to AndroidManifest
        run: |
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />|' android/app/src/main/AndroidManifest.xml

      - name: Add google-services.json
        run: |
          cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "911335724064",
              "project_id": "gen-lang-client-0490932297",
              "storage_bucket": "gen-lang-client-0490932297.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:911335724064:android:79c6cc8b0fcde66000d845",
                  "android_client_info": {
                    "package_name": "com.idxgaza.traneem"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "911335724064-9n20v3rgdsib2ff94g0enaj9uf9j3tu3.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.idxgaza.traneem",
                      "certificate_hash": "823ec2226c7be3e5729693d36cbe4c34f3312047"
                    }
                  },
                  {
                    "client_id": "911335724064-2fsqm3qlsciugqe7tri6vk33814uuerq.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyA6-Ce7t5t-BXa8bw0YjX_1qlwdWBWXmaA"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "911335724064-2fsqm3qlsciugqe7tri6vk33814uuerq.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Add Google Sign-In dependencies to build.gradle
        run: |
          sed -i 's|dependencies {|dependencies {\n    implementation "com.google.android.gms:play-services-auth:20.7.0"|' android/app/build.gradle

      - name: Create GoogleAuthPlugin Kotlin file
        run: |
          mkdir -p android/app/src/main/java/com/idxgaza/traneem
          cat > android/app/src/main/java/com/idxgaza/traneem/GoogleAuthPlugin.kt << 'EOF'
          package com.idxgaza.traneem

          import android.content.Intent
          import com.getcapacitor.JSObject
          import com.getcapacitor.Plugin
          import com.getcapacitor.PluginCall
          import com.getcapacitor.PluginMethod
          import com.getcapacitor.annotation.CapacitorPlugin
          import com.google.android.gms.auth.api.signin.GoogleSignIn
          import com.google.android.gms.auth.api.signin.GoogleSignInAccount
          import com.google.android.gms.auth.api.signin.GoogleSignInOptions
          import com.google.android.gms.common.api.ApiException
          import com.google.android.gms.common.api.Scope

          @CapacitorPlugin(name = "GoogleAuth")
          class GoogleAuthPlugin : Plugin() {

              private val RC_SIGN_IN = 9001
              private var savedCall: PluginCall? = null

              @PluginMethod
              fun signIn(call: PluginCall) {
                  savedCall = call
                  val clientId = call.getString("clientId") ?: run {
                      call.reject("clientId is required")
                      return
                  }
                  val scopes = call.getArray("scopes")
                  val gsoBuilder = GoogleSignInOptions.Builder(GoogleSignInOptions.DEFAULT_SIGN_IN)
                      .requestEmail()
                      .requestIdToken(clientId)
                      .requestServerAuthCode(clientId)
                  
                  scopes?.toList<String>()?.forEach { scope ->
                      gsoBuilder.requestScopes(Scope(scope))
                  }

                  val gso = gsoBuilder.build()
                  val googleSignInClient = GoogleSignIn.getClient(activity, gso)
                  googleSignInClient.signOut().addOnCompleteListener {
                      val signInIntent = googleSignInClient.signInIntent
                      startActivityForResult(call, signInIntent, RC_SIGN_IN)
                  }
              }

              override fun handleOnActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.handleOnActivityResult(requestCode, resultCode, data)
                  if (requestCode == RC_SIGN_IN) {
                      val task = GoogleSignIn.getSignedInAccountFromIntent(data)
                      try {
                          val account: GoogleSignInAccount = task.getResult(ApiException::class.java)
                          val result = JSObject()
                          result.put("idToken", account.idToken ?: "")
                          result.put("serverAuthCode", account.serverAuthCode ?: "")
                          result.put("email", account.email ?: "")
                          result.put("displayName", account.displayName ?: "")
                          result.put("photoUrl", account.photoUrl?.toString() ?: "")
                          savedCall?.resolve(result)
                      } catch (e: ApiException) {
                          savedCall?.reject("Google Sign-In failed: ${e.statusCode}")
                      }
                      savedCall = null
                  }
              }
          }
          EOF

      - name: Register plugin in MainActivity
        run: |
          cat > android/app/src/main/java/com/idxgaza/traneem/MainActivity.kt << 'EOF'
          package com.idxgaza.traneem

          import com.getcapacitor.BridgeActivity

          class MainActivity : BridgeActivity() {
              override fun onCreate(savedInstanceState: android.os.Bundle?) {
                  registerPlugin(GoogleAuthPlugin::class.java)
                  super.onCreate(savedInstanceState)
              }
          }
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
