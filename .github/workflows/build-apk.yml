name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Prepare google-services.json
        run: |
          python3 -c '
          import base64, os

          os.makedirs("android/app", exist_ok=True)

          s_b64 = """${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}""".strip()
          s_json = """${{ secrets.GOOGLE_SERVICES_JSON }}""".strip()

          def try_decode(s):
              if not s:
                  return None
              try:
                  clean = "".join(s.split())
                  missing_padding = len(clean) % 4
                  if missing_padding:
                      clean += "=" * (4 - missing_padding)
                  data = base64.b64decode(clean)
                  if len(data) > 0 and (b"{" in data or b"project_info" in data):
                      return data
              except Exception:
                  pass
              return None

          decoded = try_decode(s_b64)
          if decoded:
              print("Decoded google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret.")
              with open("android/app/google-services.json", "wb") as f:
                  f.write(decoded)
          elif s_json:
              print("Writing google-services.json from GOOGLE_SERVICES_JSON secret.")
              with open("android/app/google-services.json", "w") as f:
                  f.write(s_json)
          elif os.path.exists("google-services.json"):
              print("Copying google-services.json from repository root...")
              with open("google-services.json", "rb") as f_in, open("android/app/google-services.json", "wb") as f_out:
                  f_out.write(f_in.read())
          else:
              print("Warning: No google-services.json found.")
          '

      - name: Prepare debug.keystore (Decode from Secret or Generate)
        run: |
          mkdir -p ~/.android
          python3 -c '
          import base64, os

          s_b64 = """${{ secrets.DEBUG_KEYSTORE_BASE64 }}""".strip()
          s_raw = """${{ secrets.DEBUG_KEYSTORE }}""".strip()

          def try_decode(s):
              if not s:
                  return None
              try:
                  clean = "".join(s.split())
                  missing_padding = len(clean) % 4
                  if missing_padding:
                      clean += "=" * (4 - missing_padding)
                  data = base64.b64decode(clean)
                  if len(data) > 0:
                      return data
              except Exception as e:
                  print("Base64 decode warning:", e)
              return None

          data = try_decode(s_b64) or try_decode(s_raw)

          if data:
              print("Successfully decoded debug.keystore from secrets.")
              with open("debug.keystore", "wb") as f:
                  f.write(data)
          else:
              print("No valid debug.keystore secret found or decode failed. Generating temporary debug.keystore...")
              os.system("""keytool -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000""")
          '
          cp debug.keystore ~/.android/debug.keystore
          cp debug.keystore android/app/debug.keystore

      - name: Print Keystore SHA-1 and SHA-256 Fingerprints
        run: |
          echo "==================== ANDROID KEYSTORE FINGERPRINTS ===================="
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android
          echo "======================================================================="
          echo "==================== DEBUG_KEYSTORE_BASE64 (Copy to GitHub Secrets if needed) ===================="
          base64 -w 0 debug.keystore || base64 debug.keystore
          echo ""
          echo "==================================================================================================="

      - name: Register GoogleAuth plugin in MainActivity
        run: |
          cat > android/app/src/main/java/com/idxgaza/traneem/MainActivity.kt << 'EOF'
          package com.idxgaza.traneem

          import android.os.Bundle
          import com.codetrixstudio.capacitor.GoogleAuth.GoogleAuth
          import com.getcapacitor.BridgeActivity

          class MainActivity : BridgeActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  registerPlugin(GoogleAuth::class.java)
                  super.onCreate(savedInstanceState)
              }
          }
          EOF


      - name: Add permissions to AndroidManifest
        run: |
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />|' android/app/src/main/AndroidManifest.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify GoogleAuth plugin
        run: |
          cat android/app/src/main/java/com/idxgaza/traneem/MainActivity.kt

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug.keystore
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore
